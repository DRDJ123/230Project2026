<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pi Arcade Leaderboards</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; margin: 0; padding: 20px; }
        h1 { text-align: center; text-shadow: 0 0 10px #0f0; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: #222; border: 2px solid #0f0; border-radius: 8px; width: 280px; padding: 15px; box-shadow: 0 0 15px rgba(0,255,0,0.2); }
        h2 { text-transform: uppercase; border-bottom: 1px dashed #0f0; padding-bottom: 5px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 6px; text-align: left; }
        th { border-bottom: 1px solid #0f0; }
        tr:nth-child(even) { background: #1a1a1a; }
    </style>
</head>
<body>
    <h1>PI ARCADE HALL OF FAME</h1>
    <div class="container">
        {% for game, scores in leaderboards.items() %}
        <div class="card">
            <h2>{{ game }}</h2>
            <table>
                <thead>
                    <tr><th>Player</th><th>Score</th></tr>
                </thead>
                <tbody>
                    {% for name, score in scores %}
                    <tr><td>{{ name }}</td><td>{{ score }}</td></tr>
                    {% else %}
                    <tr><td colspan="2">No scores yet!</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% endfor %}
    </div>
</body>
</html>
